<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NVDA: Ascent</title>
    <meta name="description" content="A 3D game where NVIDIA's 27-year stock chart is the race course. Built with three.js, Blender and TradingView data." />
    <meta name="theme-color" content="#05070a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070a'/%3E%3Cpath d='M8 50 L20 38 L28 44 L40 22 L48 30 L56 12' fill='none' stroke='%2376b900' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="gl"></canvas>

    <!-- ── HUD ─────────────────────────────────────────────── -->
    <div id="hud" class="hud" hidden>
      <section class="hud-tl glass">
        <div class="hud-date mono" id="hDate">—</div>
        <div class="hud-price" id="hPrice">$0.00</div>
        <div class="hud-rows">
          <div class="hud-row"><span data-i18n="sinceIpo"></span><b id="hIpo" class="mono">—</b></div>
          <div class="hud-row" id="hAthRow"><span data-i18n="fromAth"></span><b id="hAth" class="mono">—</b></div>
        </div>
      </section>

      <section class="hud-tr glass">
        <div class="stat"><span data-i18n="cores"></span><b id="sCores" class="mono">0</b></div>
        <div class="stat"><span data-i18n="products"></span><b id="sProducts" class="mono">0</b></div>
        <div class="stat"><span data-i18n="milestones"></span><b id="sGates" class="mono">0</b></div>
        <div class="stat"><span data-i18n="time"></span><b id="sTime" class="mono">0:00</b></div>
      </section>

      <div class="hud-buttons">
        <button class="icon-btn" id="btnCam" title="Camera (C)" aria-label="Toggle camera">
          <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 4-7 5 6" /><path d="M3 21h18" /></svg>
        </button>
        <button class="icon-btn" id="btnMute" title="Mute (M)" aria-label="Mute">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path class="wave" d="M16 8a5 5 0 010 8M18.5 5.5a8.5 8.5 0 010 13" /></svg>
        </button>
        <button class="icon-btn" id="btnPause" title="Pause (P)" aria-label="Pause">
          <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></svg>
        </button>
      </div>

      <aside class="story" id="story"></aside>
      <div class="toasts" id="toasts"></div>
      <div class="banner" id="banner"></div>

      <section class="hud-bottom">
        <div class="speedo glass">
          <div class="speed-num mono" id="hSpeed">0</div>
          <div class="speed-unit" data-i18n="speed"></div>
          <div class="boost">
            <div class="boost-label"><span data-i18n="boost"></span><kbd>SHIFT</kbd></div>
            <div class="boost-bar"><i id="hBoost"></i></div>
          </div>
        </div>
        <div class="minimap glass"><canvas id="minimap"></canvas></div>
      </section>

      <div class="touch" id="touch">
        <div class="touch-l">
          <button data-touch="left" aria-label="Left">◀</button>
          <button data-touch="right" aria-label="Right">▶</button>
        </div>
        <div class="touch-r">
          <button data-touch="brake" aria-label="Brake">■</button>
          <button data-touch="boost" aria-label="Boost">⚡</button>
          <button data-touch="jump" class="big" aria-label="Jump">⤒</button>
        </div>
      </div>
    </div>

    <div id="countdown" class="countdown"></div>

    <!-- ── Title ────────────────────────────────────────────── -->
    <div id="title" class="screen title">
      <div class="title-left">
        <div class="brand">
          <svg viewBox="0 0 64 64" class="brand-mark"><path d="M6 52 L20 36 L28 44 L40 20 L48 30 L58 8" /></svg>
          <span class="mono">NASDAQ:NVDA · 1999 → 2026</span>
        </div>
        <h1>NVDA<span>:</span> Ascent</h1>
        <p class="kicker" data-i18n="kicker"></p>
        <p class="lead" data-i18n="lead"></p>
        <div class="cta-row">
          <button class="cta" id="btnStart" disabled>
            <span class="cta-label" data-i18n="loading"></span>
            <span class="cta-progress"><i id="loadBar"></i></span>
          </button>
          <div class="lang" role="group" aria-label="Language">
            <button data-lang="en">EN</button>
            <button data-lang="ja">日本語</button>
          </div>
        </div>
        <p class="note mono" data-i18n="dataNote"></p>
      </div>
      <div class="title-right glass">
        <h3 data-i18n="controls"></h3>
        <ul class="keys">
          <li><span><kbd>W</kbd><kbd>↑</kbd></span><em data-i18n="cAccel"></em></li>
          <li><span><kbd>S</kbd><kbd>↓</kbd></span><em data-i18n="cBrake"></em></li>
          <li><span><kbd>A</kbd><kbd>D</kbd></span><em data-i18n="cSteer"></em></li>
          <li><span><kbd>SPACE</kbd></span><em data-i18n="cJump"></em></li>
          <li><span><kbd>SHIFT</kbd></span><em data-i18n="cBoost"></em></li>
          <li><span><kbd>C</kbd></span><em data-i18n="cCam"></em></li>
          <li><span><kbd>R</kbd></span><em data-i18n="cRespawn"></em></li>
          <li><span><kbd>P</kbd></span><em data-i18n="cPause"></em></li>
        </ul>
        <div class="legend">
          <span class="chip k-milestone">●</span><span class="chip k-crash">●</span><span class="chip k-record">●</span><span class="chip k-deal">●</span><span class="chip k-origin">●</span>
        </div>
      </div>
      <p class="disclaimer" data-i18n="disclaimer"></p>
    </div>

    <!-- ── Pause ────────────────────────────────────────────── -->
    <div id="pause" class="screen modal" hidden>
      <div class="modal-card glass">
        <h2 data-i18n="paused"></h2>
        <button class="cta small" id="btnResume"><span data-i18n="resume"></span></button>
        <button class="ghost" id="btnRestart"><span data-i18n="restart"></span></button>
        <button class="ghost" id="btnQuit"><span data-i18n="quit"></span></button>
      </div>
    </div>

    <!-- ── Finish ───────────────────────────────────────────── -->
    <div id="finish" class="screen modal" hidden>
      <div class="modal-card glass finish-card">
        <p class="mono eyebrow" id="fDate"></p>
        <h2 data-i18n="summit"></h2>
        <p class="sub" data-i18n="summitSub"></p>
        <div class="invest">
          <span data-i18n="invested"></span>
          <b id="fInvest" class="mono">$0</b>
        </div>
        <div class="grade"><span data-i18n="grade"></span><b id="fGrade">S</b></div>
        <div class="fstats" id="fStats"></div>
        <button class="cta small" id="btnAgain"><span data-i18n="again"></span></button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
